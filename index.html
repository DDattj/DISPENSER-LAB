<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAN — Design Archive</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link rel="stylesheet" href="css_mainPage">
<link rel="stylesheet" href="css_modalPage">
<link rel="stylesheet" href="css_components">
</head>
<body>

<div id="globalLoader" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">안전하게 저장하는 중입니다...</div>
</div>

<div class="banner">
  <img src="images/banner.gif" alt="배너" onerror="this.style.display='none'; document.getElementById('bannerPlaceholder').style.display='flex';">
  <div class="banner-placeholder" id="bannerPlaceholder" style="display:none;">
    <b>배너 GIF를 넣어주세요</b>
    <span>images 폴더에 banner.gif 파일을 넣으면 여기에 표시됩니다</span>
  </div>
</div>

<div class="tabbar">
  <div class="tabs" id="tabBar">
    <button class="active" data-view="gallery">🖼 갤러리</button>
    <button data-view="category">📁 카테고리</button>
    <button data-view="time">⏱ 작업시간</button>
  </div>
</div>

<section class="catalog" id="catalog">
  <div id="grid"></div>
</section>

<footer id="about">
  <div>© 2026 Sian. All rights reserved.</div>
  <div>Built with plain HTML — hosted on GitHub Pages.</div>
</footer>

<button class="fab" id="fabBtn" title="새 프로젝트 추가">+</button>
<div class="login-link" id="loginLink">🔑 구글로 로그인</div>
<div class="logout-link" id="logoutLink">로그아웃</div>

<div class="modal-overlay-upload" id="modalOverlay">
  <div class="notion-modal">
    <div class="notion-header-image-container" id="headerImageContainer">
      <button class="notion-header-image-btn" id="btnHeaderImg" onclick="document.getElementById('inputHeaderImage').click()">🖼 커버 추가 (선택)</button>
      <input type="file" id="inputHeaderImage" accept="image/*" style="display: none;">
      <img id="headerImgPreview" class="notion-header-image-preview" src="" alt="헤더 이미지 미리보기">
    </div>

    <div class="notion-modal-content-area">
      <input type="text" id="inputTitle" class="notion-title-input" placeholder="제목 없음">

      <div class="notion-properties">
        <div class="notion-property-row">
          <div class="notion-property-label">📂 카테고리</div>
          <div class="notion-property-value">
            <div class="category-tags" id="categoryTags">
              <div class="tag-chip" data-value="UX 기획">UX 기획</div>
              <div class="tag-chip" data-value="UI 디자인">UI 디자인</div>
              <div class="tag-chip" data-value="디자인 시스템">디자인 시스템</div>
              <div class="tag-chip" data-value="협업·문제해결">협업·문제해결</div>
              <div class="tag-chip" data-value="AI 활용">AI 활용</div>
              <div class="tag-chip" data-value="반응형·모바일">반응형·모바일</div>
            </div>
          </div>
        </div>
        
        <div class="notion-property-row">
          <div class="notion-property-label">⏱️ 작업시간</div>
          <div class="notion-property-value">
            <input type="text" id="inputTime" class="notion-select" placeholder="클릭하여 날짜 선택 (1일 또는 기간)">
          </div>
        </div>
      </div>

      <hr class="notion-divider">

      <div style="width: 100%;">
        <div id="editor-container"></div>
      </div>

      <div class="notion-modal-actions">
        <button class="notion-btn-cancel" id="cancelBtn">취소</button>
        <button class="notion-btn-save" id="saveBtn">저장</button>
      </div>
      
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<div id="projectModal" class="project-modal-overlay">
  <div class="project-modal-content">
    <div class="modal-sticky-header">
      <button id="editProjectBtn" class="modal-action-btn admin-only-btn" title="글 수정">✏️</button>
      <button id="deleteProjectBtn" class="modal-action-btn admin-only-btn" title="글 삭제" style="color: #e03e3e;">🗑️</button>
      <button id="closeProjectBtn" class="modal-action-btn" title="닫기">✕</button>
    </div>
    
    <div class="modal-header">
      <img id="modalProjectCover" class="modal-cover-img" src="" alt="커버 이미지">
      <h1 id="modalProjectTitle" style="font-size: 32px; font-weight: 800; margin-bottom: 12px;">프로젝트 제목</h1>
      <div id="modalProjectBadges" style="margin-bottom: 20px;"></div>
    </div>
    
    <div class="modal-body" style="margin-top: 24px;">
      <div id="modalProjectContent" class="modal-body-content"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

<script src="js_config"></script>
<script src="js_ui"></script>
<script src="js_app"></script>
</body>
</html>
