<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAN — Design Archive</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg: #ffffff;
    --ink: #211f1c;
    --ink-soft: #6b675f;
    --line: #e9e5db;
    --sage: #6f7d5e;
    --sage-deep: #4b5640;
    --card-bg: #ffffff;
    --dusty: #7688a3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- Banner (GIF/이미지 넣는 자리) ---------- */
  .banner {
    position: relative;
    width: 100%;
    height: 22vh;
    min-height: 160px;
    max-height: 280px;
    overflow: hidden;
    background: linear-gradient(135deg, #eef1e9, #dfe6da);
  }

  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .banner .banner-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
  }

  .banner .banner-placeholder b {
    color: var(--ink);
    font-size: 14px;
  }

  /* ---------- Title area ---------- */
  .title-area {
    padding: 28px 8vw 16px;
  }

  .title-area h1 {
    margin: 0;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  /* ---------- Tab / filter row ---------- */
  .tabbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 28px 8vw 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
  }

  .tabs {
    display: flex;
    gap: 8px;
  }

  .tabs button {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .tabs button.active {
    background: #f1efe9;
    color: var(--ink);
  }

  .filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }

  .filter button.active,
  .filter button:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  /* ---------- Gallery grid ---------- */
  .catalog {
    padding: 0 8vw 120px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(33,31,28,0.04);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 30px -18px rgba(33,31,28,0.35);
  }

  .card-thumb {
    position: absolute;
    inset: 0;
    background: var(--line);
  }

  .card-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-body {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 10px 14px 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }

  /* ---------- Footer ---------- */
  footer {
    padding: 32px 8vw 60px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    color: var(--ink-soft);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    .catalog { padding: 0 6vw 80px; }
    .title-area, .tabbar { padding-inline: 6vw; }
  }

  /* ---------- Floating Add Button ---------- */
  .fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: none;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 12px 28px -10px rgba(33,31,28,0.5);
    z-index: 40;
    transition: transform .15s ease;
  }

  .fab:hover { transform: scale(1.06); }

  /* ---------- Upload Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(33,31,28,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
  }

  .modal h3 {
    margin: 0 0 18px;
    font-size: 18px;
    font-weight: 800;
  }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }

  .modal input[type="text"],
  .modal select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fdfcfa;
  }

  .modal input[type="file"] {
    width: 100%;
    font-size: 13px;
  }

  .modal .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .modal button.primary,
  .modal button.secondary {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
  }

  .modal button.primary { background: var(--ink); color: #fff; }
  .modal button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .modal button.secondary { background: #f1efe9; color: var(--ink); }

  .modal .status-msg {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- Login ---------- */
  .fab { display: none; } /* 로그인 전엔 숨김 */

  .login-link {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 39;
    font-size: 12px;
    color: var(--ink-soft);
    background: #fff;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px -8px rgba(33,31,28,0.3);
  }

  .login-link:hover { color: var(--ink); }

  .logout-link {
    position: fixed;
    right: 96px;
    bottom: 42px;
    z-index: 41;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
    display: none;
  }
</style>
</head>
<body>

<!--
  ▼ 배너(GIF) 자리
  images 폴더 안에 banner.gif 파일을 넣으면 자동으로 여기 나옵니다.
  파일이 없으면 아래 placeholder 문구가 대신 보여요.
-->
<div class="banner">
  <img src="images/banner.gif" alt="배너"
       onerror="this.style.display='none'; document.getElementById('bannerPlaceholder').style.display='flex';">
  <div class="banner-placeholder" id="bannerPlaceholder" style="display:none;">
    <b>배너 GIF를 넣어주세요</b>
    <span>images 폴더에 banner.gif 파일을 넣으면 여기에 표시됩니다</span>
  </div>
</div>

<div class="tabbar">
  <div class="tabs" id="tabBar">
    <button class="active" data-cat="all">🖼 갤러리</button>
  </div>
  <div class="filter" id="filterBar">
    <button data-cat="all" class="active">전체</button>
    <button data-cat="living">리빙</button>
    <button data-cat="beauty">뷰티</button>
    <button data-cat="device">소형가전</button>
    <button data-cat="etc">기타</button>
  </div>
</div>

<section class="catalog" id="catalog">
  <div class="grid" id="grid"></div>
</section>

<footer id="about">
  <div>© 2026 Sian. All rights reserved.</div>
  <div>Built with plain HTML — hosted on GitHub Pages.</div>
</footer>

<!-- 플러스 버튼 -->
<button class="fab" id="fabBtn" title="새 프로젝트 추가">+</button>

<!-- 로그인 / 로그아웃 -->
<div class="login-link" id="loginLink">🔑 구글로 로그인</div>
<div class="logout-link" id="logoutLink">로그아웃</div>

<!-- 업로드 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>새 프로젝트 추가</h3>

    <label>이미지</label>
    <input type="file" id="inputImage" accept="image/*">

    <label>제목</label>
    <input type="text" id="inputTitle" placeholder="예: 우드 트레이 시리즈">

    <label>카테고리</label>
    <select id="inputCat">
      <option value="living">리빙</option>
      <option value="beauty">뷰티</option>
      <option value="device">소형가전</option>
      <option value="etc">기타</option>
    </select>

    <div class="modal-actions">
      <button class="secondary" id="cancelBtn">취소</button>
      <button class="primary" id="saveBtn">저장</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  // ============================================================
  // ▼ Firebase 설정값 — Firebase 콘솔에서 발급받은 값으로 교체하세요
  //   (프로젝트 설정 → 일반 → 내 앱 → SDK 설정 및 구성)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAOAgQnvj4zs3bQM2dyoH69AgXk8WANOsA",
    authDomain: "designprojectsian.firebaseapp.com",
    databaseURL: "https://designprojectsian-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "designprojectsian",
    storageBucket: "designprojectsian.firebasestorage.app",
    messagingSenderId: "80013229347",
    appId: "1:80013229347:web:be1d2657e04d2c2fabe096",
    measurementId: "G-G7SR48RJQW"
  };

  let firebaseReady = false;
  let db, storage, auth;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storage = firebase.storage();
    auth = firebase.auth();
    firebaseReady = true;
  } catch (e) {
    console.warn("Firebase 설정이 아직 채워지지 않았어요. 플러스 버튼 저장 기능은 설정 완료 후 작동합니다.", e);
  }
</script>

<script>
  // 기본 프로젝트 목록 (고정)
  // img: images/01.jpg 처럼 실제 파일을 넣으면 자동으로 사진이 나오고,
  //      파일이 없으면 grad 색상으로 대체됩니다.
  const projects = [
    { no: "01", title: "쌀 수분 진정 시리즈", cat: "beauty", img: "images/01.jpg", grad: ["#e7d9c4", "#b8a184"] },
    { no: "02", title: "넥쿨러",              cat: "device", img: "images/02.jpg", grad: ["#c9d6e0", "#7c93a8"] },
    { no: "03", title: "선풍기",              cat: "device", img: "images/03.jpg", grad: ["#dfe6d9", "#8fa382"] },
    { no: "04", title: "AIR 냉감",            cat: "living", img: "images/04.jpg", grad: ["#d6e4e8", "#7fa3ac"] },
    { no: "05", title: "컴팩트 마우스 키보드 세트", cat: "device", img: "images/05.jpg", grad: ["#e2e2e2", "#9a9a9a"] },
    { no: "06", title: "강력 자석 수납 시리즈",  cat: "living", img: "images/06.jpg", grad: ["#ece0cf", "#c2a76e"] },
    { no: "07", title: "스테인리스 조리 와이어 시리즈", cat: "living", img: "images/07.jpg", grad: ["#d9dede", "#8b9494"] },
    { no: "08", title: "접이식 카트",          cat: "living", img: "images/08.jpg", grad: ["#e6d8c8", "#a98b63"] },
    { no: "09", title: "핸드 밴딩 샤워볼",      cat: "beauty", img: "images/09.jpg", grad: ["#f0dbe3", "#c98ba4"] },
    { no: "10", title: "퍼퓸바",              cat: "beauty", img: "images/10.jpg", grad: ["#ece5da", "#b9a98a"] },
    { no: "11", title: "코튼 캔들",            cat: "beauty", img: "images/11.jpg", grad: ["#f2e9df", "#cdb896"] },
    { no: "12", title: "차량용 디퓨저",        cat: "beauty", img: "images/12.jpg", grad: ["#dde3ea", "#8595ac"] },
    { no: "13", title: "블렌드티",            cat: "etc",    img: "images/13.jpg", grad: ["#e3ddc9", "#a89d6c"] },
    { no: "14", title: "열탕 소독 가습기",      cat: "device", img: "images/14.jpg", grad: ["#d6e2df", "#6f9a8f"] },
    { no: "15", title: "PengCat Puzzle",     cat: "etc",    img: "images/15.jpg", grad: ["#dbe2f0", "#8092c2"] },
    { no: "16", title: "JAJU 상세페이지 템플릿", cat: "etc",    img: "images/16.jpg", grad: ["#e8e4dc", "#a9a196"] },
    { no: "17", title: "Wanderboard",        cat: "etc",    img: "images/17.jpg", grad: ["#e0e6da", "#8fa07b"] },
  ];

  const grid = document.getElementById("grid");
  let currentFilter = "all";

  function cardHTML(p) {
    const bg = p.grad ? `background:linear-gradient(135deg, ${p.grad[0]}, ${p.grad[1]})` : "background:#e9e5db";
    const imgTag = p.img
      ? `<img src="${p.img}" alt="${p.title}" onerror="this.style.display='none';">`
      : "";
    return `
      <div class="card-thumb" style="${bg}">
        ${imgTag}
      </div>
      <div class="card-body">
        <span class="card-title">${p.title}</span>
      </div>
    `;
  }

  function render(filter) {
    currentFilter = filter;
    grid.innerHTML = "";
    projects
      .filter(p => filter === "all" || p.cat === filter)
      .forEach(p => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = "#";
        card.innerHTML = cardHTML(p);
        grid.appendChild(card);
      });
  }

  document.getElementById("filterBar").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#filterBar button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.cat);
  });

  render("all");

  // ============================================================
  // Firestore에서 사용자가 추가한 프로젝트 불러오기
  // ============================================================
  async function loadUserProjects() {
    if (!firebaseReady) return;
    try {
      const snapshot = await db.collection("projects").orderBy("createdAt", "desc").get();
      snapshot.forEach(doc => {
        const d = doc.data();
        projects.push({ title: d.title, cat: d.cat, img: d.imageUrl, grad: null });
      });
      render(currentFilter);
    } catch (e) {
      console.warn("프로젝트 불러오기 실패:", e);
    }
  }
  loadUserProjects();

  // ============================================================
  // 플러스 버튼 / 모달 / 저장 로직
  // ============================================================
  const fabBtn = document.getElementById("fabBtn");
  const modalOverlay = document.getElementById("modalOverlay");
  const cancelBtn = document.getElementById("cancelBtn");
  const saveBtn = document.getElementById("saveBtn");
  const statusMsg = document.getElementById("statusMsg");

  fabBtn.addEventListener("click", () => {
    modalOverlay.classList.add("open");
  });

  cancelBtn.addEventListener("click", () => {
    modalOverlay.classList.remove("open");
    statusMsg.textContent = "";
  });

  // ============================================================
  // 로그인 / 로그아웃 (구글 로그인)
  // ============================================================
  const loginLink = document.getElementById("loginLink");
  const logoutLink = document.getElementById("logoutLink");

  loginLink.addEventListener("click", async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      console.error(e);
      alert("로그인에 실패했어요: " + e.message);
    }
  });

  logoutLink.addEventListener("click", () => {
    auth.signOut();
  });

  // ============================================================
  // 관리자 이메일 화이트리스트
  // ============================================================
  const ADMIN_EMAILS = ["imddattj@gmail.com"];

  // 로그인 상태에 따라 + 버튼 노출
  if (firebaseReady) {
    auth.onAuthStateChanged((user) => {
      const isAdmin = user && ADMIN_EMAILS.includes(user.email);

      if (user && !isAdmin) {
        // 허용되지 않은 계정으로 로그인한 경우 바로 로그아웃
        alert("관리자 계정이 아니에요. 다른 구글 계정으로 로그인해주세요.");
        auth.signOut();
        return;
      }

      if (isAdmin) {
        fabBtn.style.display = "flex";
        fabBtn.style.alignItems = "center";
        fabBtn.style.justifyContent = "center";
        loginLink.style.display = "none";
        logoutLink.style.display = "block";
      } else {
        fabBtn.style.display = "none";
        loginLink.style.display = "block";
        logoutLink.style.display = "none";
      }
    });
  }

  saveBtn.addEventListener("click", async () => {
    const file = document.getElementById("inputImage").files[0];
    const title = document.getElementById("inputTitle").value.trim();
    const cat = document.getElementById("inputCat").value;

    if (!file || !title) {
      statusMsg.textContent = "이미지와 제목을 모두 입력해주세요.";
      return;
    }

    saveBtn.disabled = true;
    statusMsg.textContent = "업로드 중...";

    try {
      // 1. Storage에 이미지 업로드
      const fileRef = storage.ref().child(`uploads/${Date.now()}_${file.name}`);
      await fileRef.put(file);
      const imageUrl = await fileRef.getDownloadURL();

      // 2. Firestore에 데이터 저장
      await db.collection("projects").add({
        title,
        cat,
        imageUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // 3. 화면에 바로 반영
      projects.unshift({ title, cat, img: imageUrl, grad: null });
      render(currentFilter);

      statusMsg.textContent = "저장 완료!";
      setTimeout(() => {
        modalOverlay.classList.remove("open");
        statusMsg.textContent = "";
        document.getElementById("inputImage").value = "";
        document.getElementById("inputTitle").value = "";
      }, 600);

    } catch (e) {
      console.error(e);
      statusMsg.textContent = "저장 실패: " + e.message;
    } finally {
      saveBtn.disabled = false;
    }
  });
</script>

</body>
</html>
